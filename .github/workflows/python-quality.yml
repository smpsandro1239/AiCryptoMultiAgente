name: Python quality

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest

      - name: Lint risk, execution, core and tests
        run: >-
          ruff check multiagent_trading/core/orchestrator.py multiagent_trading/core/risk_engine.py\n          multiagent_trading/core/order_store.py multiagent_trading/agents/risk.py
          multiagent_trading/agents/execution.py multiagent_trading/agents/supervisor.py
          multiagent_trading/agents/scanner.py multiagent_trading/models/portfolio.py tests
