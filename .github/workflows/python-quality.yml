name: Python quality

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest

      - name: Lint core and tests
        run: >-\n          ruff check multiagent_trading/core multiagent_trading/agents/risk.py\n          multiagent_trading/agents/execution.py multiagent_trading/agents/supervisor.py\n          multiagent_trading/agents/scanner.py multiagent_trading/models/portfolio.py tests
