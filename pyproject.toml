[project]
name = "multiagent-trading-framework"
version = "0.5.0"
description = "AI-native multi-agent trading framework"
authors = [{name = "Sandro"}]
license = {text = "MIT"}
dependencies = [
    "ccxt",
    "pandas",
    "numpy",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
